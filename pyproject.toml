[project]
name = "deadline-agent"
version = "0.1.0"
description = "Deadline — an agent that watches your open hackathon submission deadlines and proactively reaches you before you miss one, on whichever channel you're near. Built on caspian-sdk: one handler, Telegram + Discord."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "caspian-sdk>=0.6.4",
    "httpx>=0.28,<1",
    "dateparser>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deadline_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
